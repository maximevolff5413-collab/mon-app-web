<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Planning</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  button { margin: 5px; padding: 10px 15px; }
  .poste { margin-top: 10px; }
</style>
</head>
<body>

<h2>Choisis un jour :</h2>
<div id="jours">
  <button onclick="afficherJour('Lundi')">Lundi</button>
  <button onclick="afficherJour('Mardi')">Mardi</button>
  <button onclick="afficherJour('Mercredi')">Mercredi</button>
  <button onclick="afficherJour('Jeudi')">Jeudi</button>
  <button onclick="afficherJour('Vendredi')">Vendredi</button>
</div>

<h3 id="titreJour"></h3>
<div id="planning"></div>

<script>
const sheetId = "1BHJ-afKT6djngOzv9fknU8jMmYrGDhsHbxw5pl8jHXE"; // remplace par ton ID
const sheetName = "Planning";

let dataPlanning = [];

// Charger les données depuis Google Sheet
async function chargerPlanning() {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
  const response = await fetch(url);
  const text = await response.text();
  
  // Supprimer le wrapper "google.visualization.Query.setResponse(...);"
  const json = JSON.parse(text.substr(47).slice(0, -2));
  
  const rows = json.table.rows;
  const cols = json.table.cols.map(c => c.label);
  
  dataPlanning = rows.map(row => {
    let obj = {};
    row.c.forEach((cell, i) => {
      obj[cols[i]] = cell ? cell.v : "";
    });
    return obj;
  });
}

function afficherJour(jour) {
  if (!dataPlanning.length) {
    alert("Données non chargées encore !");
    return;
  }

  const container = document.getElementById("planning");
  container.innerHTML = "";
  document.getElementById("titreJour").textContent = jour;

  dataPlanning.forEach(poste => {
    const div = document.createElement("div");
    div.className = "poste";
    div.textContent = `${poste["Poste"]} : ${poste[jour]}`;
    container.appendChild(div);
  });
}

// Charger les données au démarrage
chargerPlanning();
</script>

</body>
</html>
