<body>

<h2>Connexion</h2>
<div id="login">
  <input type="text" id="identifiant" placeholder="Entrez votre identifiant">
  <button onclick="login()">Se connecter</button>
</div>

<div id="app" style="display:none;">
  <h2>Choisis un jour :</h2>
  <div id="jours">
    <button onclick="afficherJour('Lundi')">Lundi</button>
    <button onclick="afficherJour('Mardi')">Mardi</button>
    <button onclick="afficherJour('Mercredi')">Mercredi</button>
    <button onclick="afficherJour('Jeudi')">Jeudi</button>
    <button onclick="afficherJour('Vendredi')">Vendredi</button>
  </div>

  <h3 id="titreJour"></h3>
  <div id="planning"></div>
</div>

<script>
const sheetId = "1BHJ-afKT6djngOzv9fknU8jMmYrGDhsHbxw5pl8jHXE"; // remplace par ton ID
const planningSheet = "Planning";
const userSheet = "User";

let dataPlanning = [];
let dataUsers = [];
let currentUser = null;

// Charger les données d'un onglet
async function chargerSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
  const response = await fetch(url);
  const text = await response.text();
  const json = JSON.parse(text.substr(47).slice(0, -2));
  const rows = json.table.rows;
  const cols = json.table.cols.map(c => c.label);
  return rows.map(row => {
    let obj = {};
    row.c.forEach((cell, i) => { obj[cols[i]] = cell ? cell.v : ""; });
    return obj;
  });
}

// Charger tous les onglets au démarrage
async function init() {
  dataPlanning = await chargerSheet(planningSheet);
  dataUsers = await chargerSheet(userSheet);
}
init();

// Vérifier l'identifiant
function login() {
  const id = document.getElementById("identifiant").value.trim();
  const user = dataUsers.find(u => u.Identifiant === id);
  if (user) {
    currentUser = user.Nom;
    document.getElementById("login").style.display = "none"; // masquer le formulaire
    document.getElementById("app").style.display = "block";   // afficher l'app
  } else {
    alert("Identifiant inconnu !");
  }
}

// Afficher les postes pour l'utilisateur connecté et le jour choisi
function afficherJour(jour) {
  if (!currentUser) return;
  const container = document.getElementById("planning");
  container.innerHTML = "";
  document.getElementById("titreJour").textContent = jour;

  dataPlanning.forEach(poste => {
    if (poste[jour] === currentUser) {
      const div = document.createElement("div");
      div.className = "poste";
      div.textContent = `${poste["Poste"]}`;
      container.appendChild(div);
    }
  });
}
</script>
